name: Manual Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTGATE_ENV: development
      AGENTGATE_DATABASE_URL: sqlite:///./agentgate_e2e.db
      AGENTGATE_JOB_DISPATCH_MODE: inline
      AGENTGATE_E2E_BASE_URL: http://127.0.0.1:3000
      AGENTGATE_E2E_API_BASE_URL: http://127.0.0.1:8000
      AGENTGATE_E2E_EMAIL: admin@demo.agentgate.local
      AGENTGATE_E2E_PASSWORD: AgentGate123!
      AGENTGATE_E2E_TENANT_SLUG: demo-agentgate
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Prepare backend database
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m app.db.seed

      - name: Start backend
        working-directory: apps/api
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../api-e2e.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Start frontend
        working-directory: apps/web
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > ../../web-e2e.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time."
          exit 1

      - name: Run Playwright E2E
        working-directory: apps/web
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api-e2e.log
            web-e2e.log
          if-no-files-found: ignore
