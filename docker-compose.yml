services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
    ports:
      - "127.0.0.1:${AGENTGATE_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate -d agentgate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${AGENTGATE_LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AGENTGATE_ENV: ${AGENTGATE_ENV:-development}
      AGENTGATE_DEBUG: ${AGENTGATE_DEBUG:-true}
      AGENTGATE_SECRET_KEY: ${AGENTGATE_SECRET_KEY:-change-me-to-a-long-random-development-secret}
      AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES: ${AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENTGATE_DEFAULT_TENANT_PLAN: ${AGENTGATE_DEFAULT_TENANT_PLAN:-enterprise-trial}
      AGENTGATE_AUTO_CREATE_SCHEMA: "false"
      AGENTGATE_DATABASE_URL: ${AGENTGATE_DATABASE_URL:-postgresql+psycopg://agentgate:agentgate@postgres:5432/agentgate}
      AGENTGATE_REDIS_URL: ${AGENTGATE_REDIS_URL:-redis://redis:6379/0}
      AGENTGATE_CORS_ORIGINS: '${AGENTGATE_CORS_ORIGINS:-["http://localhost:3000"]}'
      AGENTGATE_PUBLIC_APP_URL: ${AGENTGATE_PUBLIC_APP_URL:-http://localhost:3000}
      AGENTGATE_PUBLIC_API_URL: ${AGENTGATE_PUBLIC_API_URL:-http://localhost:8000}
      AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS: ${AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS:-false}
      AGENTGATE_KEY_PROVIDER: ${AGENTGATE_KEY_PROVIDER:-env}
      AGENTGATE_AWS_REGION: ${AGENTGATE_AWS_REGION:-}
      AGENTGATE_AWS_KMS_KEY_ID: ${AGENTGATE_AWS_KMS_KEY_ID:-}
      AGENTGATE_AWS_KMS_ENDPOINT_URL: ${AGENTGATE_AWS_KMS_ENDPOINT_URL:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF:-configured-env}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION:-1}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS:-{}}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS:-{}}
      AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS: ${AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS:-false}
      AGENTGATE_ALLOW_DEMO_CREDENTIALS: ${AGENTGATE_ALLOW_DEMO_CREDENTIALS:-false}
      AGENTGATE_OIDC_HTTP_TIMEOUT_SECONDS: ${AGENTGATE_OIDC_HTTP_TIMEOUT_SECONDS:-5}
      AGENTGATE_OIDC_STATE_TTL_SECONDS: ${AGENTGATE_OIDC_STATE_TTL_SECONDS:-600}
      AGENTGATE_OIDC_EXCHANGE_TTL_SECONDS: ${AGENTGATE_OIDC_EXCHANGE_TTL_SECONDS:-180}
      AGENTGATE_SLACK_NOTIFICATIONS_ENABLED: ${AGENTGATE_SLACK_NOTIFICATIONS_ENABLED:-false}
      AGENTGATE_SLACK_BOT_TOKEN_ENV_VAR: ${AGENTGATE_SLACK_BOT_TOKEN_ENV_VAR:-AGENTGATE_SLACK_BOT_TOKEN}
      AGENTGATE_SLACK_DEFAULT_CHANNEL: ${AGENTGATE_SLACK_DEFAULT_CHANNEL:-}
      AGENTGATE_SLACK_BOT_TOKEN: ${AGENTGATE_SLACK_BOT_TOKEN:-}
      AGENTGATE_GITHUB_TOKEN: ${AGENTGATE_GITHUB_TOKEN:-}
      AGENTGATE_GITHUB_APP_PRIVATE_KEY: ${AGENTGATE_GITHUB_APP_PRIVATE_KEY:-}
      AGENTGATE_AUDIT_INTEGRITY_ANCHOR_TYPE: ${AGENTGATE_AUDIT_INTEGRITY_ANCHOR_TYPE:-local}
      AGENTGATE_AUDIT_INTEGRITY_LOCAL_PATH: ${AGENTGATE_AUDIT_INTEGRITY_LOCAL_PATH:-.tmp/audit-integrity-checkpoints}
      AGENTGATE_AUDIT_INTEGRITY_S3_BUCKET: ${AGENTGATE_AUDIT_INTEGRITY_S3_BUCKET:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_PREFIX: ${AGENTGATE_AUDIT_INTEGRITY_S3_PREFIX:-agentgate/audit-integrity}
      AGENTGATE_AUDIT_INTEGRITY_S3_REGION: ${AGENTGATE_AUDIT_INTEGRITY_S3_REGION:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_ENDPOINT_URL: ${AGENTGATE_AUDIT_INTEGRITY_S3_ENDPOINT_URL:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_ACCESS_KEY_ID_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_ACCESS_KEY_ID_REF:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_SECRET_ACCESS_KEY_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_SECRET_ACCESS_KEY_REF:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_SESSION_TOKEN_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_SESSION_TOKEN_REF:-}
      AGENTGATE_JOB_DISPATCH_MODE: ${AGENTGATE_JOB_DISPATCH_MODE:-worker}
      AGENTGATE_JOB_BROKER: ${AGENTGATE_JOB_BROKER:-redis}
      AGENTGATE_JOB_REDIS_QUEUE_NAME: ${AGENTGATE_JOB_REDIS_QUEUE_NAME:-agentgate:jobs}
      AGENTGATE_JOB_POLL_INTERVAL_SECONDS: ${AGENTGATE_JOB_POLL_INTERVAL_SECONDS:-2}
      AGENTGATE_JOB_WORKER_BATCH_SIZE: ${AGENTGATE_JOB_WORKER_BATCH_SIZE:-10}
      AGENTGATE_JOB_SLACK_MAX_ATTEMPTS: ${AGENTGATE_JOB_SLACK_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_SLACK_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_SLACK_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_AUDIT_EXPORT_TIMEOUT_SECONDS: ${AGENTGATE_AUDIT_EXPORT_TIMEOUT_SECONDS:-5}
      AGENTGATE_JOB_AUDIT_EXPORT_MAX_ATTEMPTS: ${AGENTGATE_JOB_AUDIT_EXPORT_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_AUDIT_EXPORT_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_AUDIT_EXPORT_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_MAX_ATTEMPTS: ${AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_JOB_RETENTION_MAX_ATTEMPTS: ${AGENTGATE_JOB_RETENTION_MAX_ATTEMPTS:-2}
      AGENTGATE_JOB_RETENTION_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_RETENTION_RETRY_BACKOFF_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_ENABLED: ${AGENTGATE_RATE_LIMIT_ENABLED:-false}
      AGENTGATE_RATE_LIMIT_PROVIDER: ${AGENTGATE_RATE_LIMIT_PROVIDER:-in_memory}
      AGENTGATE_ALLOW_IN_MEMORY_RATE_LIMIT_IN_PRODUCTION: ${AGENTGATE_ALLOW_IN_MEMORY_RATE_LIMIT_IN_PRODUCTION:-false}
      AGENTGATE_RATE_LIMIT_FAIL_OPEN_ON_BACKEND_ERROR: ${AGENTGATE_RATE_LIMIT_FAIL_OPEN_ON_BACKEND_ERROR:-false}
      AGENTGATE_RATE_LIMIT_LOGIN_LIMIT: ${AGENTGATE_RATE_LIMIT_LOGIN_LIMIT:-5}
      AGENTGATE_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_OIDC_LIMIT: ${AGENTGATE_RATE_LIMIT_OIDC_LIMIT:-10}
      AGENTGATE_RATE_LIMIT_OIDC_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_OIDC_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_GATEWAY_LIMIT: ${AGENTGATE_RATE_LIMIT_GATEWAY_LIMIT:-30}
      AGENTGATE_RATE_LIMIT_GATEWAY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_GATEWAY_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_APPROVAL_LIMIT: ${AGENTGATE_RATE_LIMIT_APPROVAL_LIMIT:-20}
      AGENTGATE_RATE_LIMIT_APPROVAL_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_APPROVAL_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_LIMIT: ${AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_LIMIT:-6}
      AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_RETENTION_LIMIT: ${AGENTGATE_RATE_LIMIT_RETENTION_LIMIT:-4}
      AGENTGATE_RATE_LIMIT_RETENTION_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_RETENTION_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_JOBS_RETRY_LIMIT: ${AGENTGATE_RATE_LIMIT_JOBS_RETRY_LIMIT:-6}
      AGENTGATE_RATE_LIMIT_JOBS_RETRY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_JOBS_RETRY_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_LIMIT: ${AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_LIMIT:-4}
      AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_WINDOW_SECONDS:-300}
    ports:
      - "127.0.0.1:${AGENTGATE_LOCAL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment: &worker_environment
      AGENTGATE_ENV: ${AGENTGATE_ENV:-development}
      AGENTGATE_DEBUG: ${AGENTGATE_DEBUG:-true}
      AGENTGATE_SECRET_KEY: ${AGENTGATE_SECRET_KEY:-change-me-to-a-long-random-development-secret}
      AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES: ${AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENTGATE_DEFAULT_TENANT_PLAN: ${AGENTGATE_DEFAULT_TENANT_PLAN:-enterprise-trial}
      AGENTGATE_AUTO_CREATE_SCHEMA: "false"
      AGENTGATE_DATABASE_URL: ${AGENTGATE_DATABASE_URL:-postgresql+psycopg://agentgate:agentgate@postgres:5432/agentgate}
      AGENTGATE_REDIS_URL: ${AGENTGATE_REDIS_URL:-redis://redis:6379/0}
      AGENTGATE_PUBLIC_APP_URL: ${AGENTGATE_PUBLIC_APP_URL:-http://localhost:3000}
      AGENTGATE_PUBLIC_API_URL: ${AGENTGATE_PUBLIC_API_URL:-http://localhost:8000}
      AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS: ${AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS:-false}
      AGENTGATE_KEY_PROVIDER: ${AGENTGATE_KEY_PROVIDER:-env}
      AGENTGATE_AWS_REGION: ${AGENTGATE_AWS_REGION:-}
      AGENTGATE_AWS_KMS_KEY_ID: ${AGENTGATE_AWS_KMS_KEY_ID:-}
      AGENTGATE_AWS_KMS_ENDPOINT_URL: ${AGENTGATE_AWS_KMS_ENDPOINT_URL:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF:-configured-env}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION:-1}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS:-{}}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS:-{}}
      AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS: ${AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS:-false}
      AGENTGATE_ALLOW_DEMO_CREDENTIALS: ${AGENTGATE_ALLOW_DEMO_CREDENTIALS:-false}
      AGENTGATE_OIDC_HTTP_TIMEOUT_SECONDS: ${AGENTGATE_OIDC_HTTP_TIMEOUT_SECONDS:-5}
      AGENTGATE_OIDC_STATE_TTL_SECONDS: ${AGENTGATE_OIDC_STATE_TTL_SECONDS:-600}
      AGENTGATE_OIDC_EXCHANGE_TTL_SECONDS: ${AGENTGATE_OIDC_EXCHANGE_TTL_SECONDS:-180}
      AGENTGATE_SLACK_NOTIFICATIONS_ENABLED: ${AGENTGATE_SLACK_NOTIFICATIONS_ENABLED:-false}
      AGENTGATE_SLACK_BOT_TOKEN_ENV_VAR: ${AGENTGATE_SLACK_BOT_TOKEN_ENV_VAR:-AGENTGATE_SLACK_BOT_TOKEN}
      AGENTGATE_SLACK_DEFAULT_CHANNEL: ${AGENTGATE_SLACK_DEFAULT_CHANNEL:-}
      AGENTGATE_SLACK_BOT_TOKEN: ${AGENTGATE_SLACK_BOT_TOKEN:-}
      AGENTGATE_GITHUB_TOKEN: ${AGENTGATE_GITHUB_TOKEN:-}
      AGENTGATE_GITHUB_APP_PRIVATE_KEY: ${AGENTGATE_GITHUB_APP_PRIVATE_KEY:-}
      AGENTGATE_AUDIT_INTEGRITY_ANCHOR_TYPE: ${AGENTGATE_AUDIT_INTEGRITY_ANCHOR_TYPE:-local}
      AGENTGATE_AUDIT_INTEGRITY_LOCAL_PATH: ${AGENTGATE_AUDIT_INTEGRITY_LOCAL_PATH:-.tmp/audit-integrity-checkpoints}
      AGENTGATE_AUDIT_INTEGRITY_S3_BUCKET: ${AGENTGATE_AUDIT_INTEGRITY_S3_BUCKET:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_PREFIX: ${AGENTGATE_AUDIT_INTEGRITY_S3_PREFIX:-agentgate/audit-integrity}
      AGENTGATE_AUDIT_INTEGRITY_S3_REGION: ${AGENTGATE_AUDIT_INTEGRITY_S3_REGION:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_ENDPOINT_URL: ${AGENTGATE_AUDIT_INTEGRITY_S3_ENDPOINT_URL:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_ACCESS_KEY_ID_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_ACCESS_KEY_ID_REF:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_SECRET_ACCESS_KEY_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_SECRET_ACCESS_KEY_REF:-}
      AGENTGATE_AUDIT_INTEGRITY_S3_SESSION_TOKEN_REF: ${AGENTGATE_AUDIT_INTEGRITY_S3_SESSION_TOKEN_REF:-}
      AGENTGATE_JOB_DISPATCH_MODE: ${AGENTGATE_JOB_DISPATCH_MODE:-worker}
      AGENTGATE_JOB_BROKER: ${AGENTGATE_JOB_BROKER:-redis}
      AGENTGATE_JOB_REDIS_QUEUE_NAME: ${AGENTGATE_JOB_REDIS_QUEUE_NAME:-agentgate:jobs}
      AGENTGATE_JOB_POLL_INTERVAL_SECONDS: ${AGENTGATE_JOB_POLL_INTERVAL_SECONDS:-2}
      AGENTGATE_JOB_WORKER_BATCH_SIZE: ${AGENTGATE_JOB_WORKER_BATCH_SIZE:-10}
      AGENTGATE_JOB_SLACK_MAX_ATTEMPTS: ${AGENTGATE_JOB_SLACK_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_SLACK_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_SLACK_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_AUDIT_EXPORT_TIMEOUT_SECONDS: ${AGENTGATE_AUDIT_EXPORT_TIMEOUT_SECONDS:-5}
      AGENTGATE_JOB_AUDIT_EXPORT_MAX_ATTEMPTS: ${AGENTGATE_JOB_AUDIT_EXPORT_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_AUDIT_EXPORT_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_AUDIT_EXPORT_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_MAX_ATTEMPTS: ${AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_MAX_ATTEMPTS:-3}
      AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_AUDIT_INTEGRITY_CHECKPOINT_RETRY_BACKOFF_SECONDS:-30}
      AGENTGATE_JOB_RETENTION_MAX_ATTEMPTS: ${AGENTGATE_JOB_RETENTION_MAX_ATTEMPTS:-2}
      AGENTGATE_JOB_RETENTION_RETRY_BACKOFF_SECONDS: ${AGENTGATE_JOB_RETENTION_RETRY_BACKOFF_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_ENABLED: ${AGENTGATE_RATE_LIMIT_ENABLED:-false}
      AGENTGATE_RATE_LIMIT_PROVIDER: ${AGENTGATE_RATE_LIMIT_PROVIDER:-in_memory}
      AGENTGATE_ALLOW_IN_MEMORY_RATE_LIMIT_IN_PRODUCTION: ${AGENTGATE_ALLOW_IN_MEMORY_RATE_LIMIT_IN_PRODUCTION:-false}
      AGENTGATE_RATE_LIMIT_FAIL_OPEN_ON_BACKEND_ERROR: ${AGENTGATE_RATE_LIMIT_FAIL_OPEN_ON_BACKEND_ERROR:-false}
      AGENTGATE_RATE_LIMIT_LOGIN_LIMIT: ${AGENTGATE_RATE_LIMIT_LOGIN_LIMIT:-5}
      AGENTGATE_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_OIDC_LIMIT: ${AGENTGATE_RATE_LIMIT_OIDC_LIMIT:-10}
      AGENTGATE_RATE_LIMIT_OIDC_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_OIDC_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_GATEWAY_LIMIT: ${AGENTGATE_RATE_LIMIT_GATEWAY_LIMIT:-30}
      AGENTGATE_RATE_LIMIT_GATEWAY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_GATEWAY_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_APPROVAL_LIMIT: ${AGENTGATE_RATE_LIMIT_APPROVAL_LIMIT:-20}
      AGENTGATE_RATE_LIMIT_APPROVAL_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_APPROVAL_WINDOW_SECONDS:-60}
      AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_LIMIT: ${AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_LIMIT:-6}
      AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_AUDIT_EXPORT_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_RETENTION_LIMIT: ${AGENTGATE_RATE_LIMIT_RETENTION_LIMIT:-4}
      AGENTGATE_RATE_LIMIT_RETENTION_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_RETENTION_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_JOBS_RETRY_LIMIT: ${AGENTGATE_RATE_LIMIT_JOBS_RETRY_LIMIT:-6}
      AGENTGATE_RATE_LIMIT_JOBS_RETRY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_JOBS_RETRY_WINDOW_SECONDS:-300}
      AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_LIMIT: ${AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_LIMIT:-4}
      AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_WINDOW_SECONDS: ${AGENTGATE_RATE_LIMIT_AUDIT_INTEGRITY_WINDOW_SECONDS:-300}
    depends_on: &background_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.scheduler"]
    environment: *worker_environment
    depends_on: *background_dependencies

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${AGENTGATE_LOCAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      AGENTGATE_ENV: ${AGENTGATE_ENV:-development}
      AGENTGATE_DEBUG: ${AGENTGATE_DEBUG:-true}
      AGENTGATE_SECRET_KEY: ${AGENTGATE_SECRET_KEY:-change-me-to-a-long-random-development-secret}
      AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES: ${AGENTGATE_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENTGATE_DEFAULT_TENANT_PLAN: ${AGENTGATE_DEFAULT_TENANT_PLAN:-enterprise-trial}
      AGENTGATE_AUTO_CREATE_SCHEMA: "false"
      AGENTGATE_DATABASE_URL: ${AGENTGATE_DATABASE_URL:-postgresql+psycopg://agentgate:agentgate@postgres:5432/agentgate}
      AGENTGATE_REDIS_URL: ${AGENTGATE_REDIS_URL:-redis://redis:6379/0}
      AGENTGATE_PUBLIC_APP_URL: ${AGENTGATE_PUBLIC_APP_URL:-http://localhost:3000}
      AGENTGATE_PUBLIC_API_URL: ${AGENTGATE_PUBLIC_API_URL:-http://localhost:8000}
      AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS: ${AGENTGATE_ALLOW_INSECURE_PUBLIC_URLS:-false}
      AGENTGATE_KEY_PROVIDER: ${AGENTGATE_KEY_PROVIDER:-env}
      AGENTGATE_AWS_REGION: ${AGENTGATE_AWS_REGION:-}
      AGENTGATE_AWS_KMS_KEY_ID: ${AGENTGATE_AWS_KMS_KEY_ID:-}
      AGENTGATE_AWS_KMS_ENDPOINT_URL: ${AGENTGATE_AWS_KMS_ENDPOINT_URL:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_SECRET_REF:-}
      AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF: ${AGENTGATE_PAYLOAD_ENCRYPTION_ACTIVE_KEY_REF:-configured-env}
      AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION: ${AGENTGATE_PAYLOAD_ENCRYPTION_KEY_VERSION:-1}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEYS:-{}}
      AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS: ${AGENTGATE_PAYLOAD_ENCRYPTION_ADDITIONAL_KEY_VERSIONS:-{}}
      AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS: ${AGENTGATE_ALLOW_PRIVATE_AUDIT_EXPORT_DESTINATIONS:-false}
