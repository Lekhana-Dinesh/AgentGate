[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate-api"
version = "0.1.0"
description = "AgentGate runtime control plane API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.1",
  "argon2-cffi>=23.1.0",
  "boto3>=1.35.0",
  "cryptography>=45.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.7",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "pip-audit>=2.7.3",
  "pytest>=8.3.2",
  "ruff>=0.11.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".tmp",
  "alembic",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
